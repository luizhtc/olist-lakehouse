# This is a Databricks asset bundle definition for olist_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: olist_lakehouse
  uuid: d107ca77-8e49-4d28-91a0-3d8345851e92
  engine: direct

include:
  - resources/*.yml
  - resources/**/*.yml
  - databricks.local.yml
  - variables.yml

artifacts:
  olist_lakehouse:
    type: whl
    build: |
      rm -rf dist/
      uv build --package olist-lakehouse --out-dir dist/

targets:
  dev:
    mode: development
    default: true
    workspace:
      # workspace.host default value is set in databricks.local.yml for safety reasons
      root_path: /Workspace/Users/${var.workspace_user}/Bundles/${bundle.name}/${bundle.target}
    permissions: 
      - user_name: ${var.workspace_user}
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      # workspace.host default value is set in databricks.local.yml for safety reasons
      root_path: /Workspace/Bundles/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${var.workspace_user}
        level: CAN_MANAGE
