# This is a Databricks asset bundle definition for olist_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: olist_lakehouse
  uuid: d107ca77-8e49-4d28-91a0-3d8345851e92
  engine: direct

include:
  - resources/*.yml
  - resources/**/*.yml
  - databricks.local.yml

artifacts:
  olist_lakehouse:
    type: whl
    build: |
      rm -rf dist/
      uv build --package olist-lakehouse --out-dir dist/

variables:
  catalog_name:
    description: Name of the catalog to be used for deployed assets and resources.
    default: olist
  bronze_schema_name:
    description: The name of the bronze schema for Unity Catalog to store tables.
    default: bze
  silver_schema_name:
    description: The name of the silver schema for Unity Catalog to store tables.
    default: slv
  gold_schema_name:
    description: The name of the gold schema for Unity Catalog to store tables.
    default: gld

# This is an example configuration, you can tailor the targets according
# to your needs, use this documentation for reference:
# https://docs.databricks.com/aws/en/dev-tools/bundles/reference#targets
targets:
  dev:
    mode: development
    default: true
    workspace:
      # workspace.host default value is set in databricks.local.yml for safety reasons
      # see databricks.local.yml.example
      root_path: /Workspace/Users/${var.workspace_user}/.bundle/${bundle.name}/${bundle.target}
    permissions: 
      - user_name: ${var.workspace_user}
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      # workspace.host default value is set in databricks.local.yml for safety reasons
      # see databricks.local.yml.example
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${var.workspace_user}
        level: CAN_MANAGE
